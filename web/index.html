<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Eigen Cloud</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="loginForm" class="card">
      <h1>Eigen Cloud</h1>
      <p class="muted">Mail · Agenda · Foto's</p>
      <input type="password" id="password" placeholder="Wachtwoord" autocomplete="current-password" required>
      <button class="primary">Inloggen</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <nav class="tabs">
        <button data-tab="mail" class="active">✉️ <span>Mail</span></button>
        <button data-tab="agenda">📅 <span>Agenda</span></button>
        <button data-tab="fotos">🖼️ <span>Foto's</span></button>
        <button data-tab="nodes" hidden>🐌 <span>Waar draai ik</span></button>
      </nav>
      <button id="logout" class="ghost" title="Uitloggen">⎋</button>
    </header>

    <!-- MAIL -->
    <main id="tab-mail" class="tab">
      <aside class="side">
        <button id="compose" class="primary block">+ Nieuw bericht</button>
        <ul id="folders" class="navlist"></ul>
        <h4>Labels</h4>
        <ul id="labels" class="navlist"></ul>
      </aside>
      <section class="list-pane">
        <form id="mailSearch" class="search"><input type="search" id="mailQ" placeholder="Zoeken in mail"></form>
        <ul id="messages" class="messages"></ul>
        <button id="moreMail" class="ghost block" hidden>Meer laden</button>
      </section>
      <section id="reader" class="reader empty"><p class="muted">Selecteer een bericht</p></section>
    </main>

    <!-- AGENDA -->
    <main id="tab-agenda" class="tab" hidden>
      <div class="cal-head">
        <button id="calPrev" class="ghost">‹</button>
        <h2 id="calTitle"></h2>
        <button id="calNext" class="ghost">›</button>
        <button id="calToday" class="ghost">Vandaag</button>
        <span class="grow"></span>
        <button id="newEvent" class="primary">+ Afspraak</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div id="dayList" class="day-list"></div>
    </main>

    <!-- FOTO'S -->
    <main id="tab-fotos" class="tab" hidden>
      <div class="photo-head">
        <select id="photoFilter">
          <option value="">Alle foto's</option>
          <option value="favorites">★ Favorieten</option>
          <option value="videos">Video's</option>
        </select>
        <select id="albumFilter"><option value="">Geen album</option></select>
        <span class="grow"></span>
        <label class="primary upload">⬆ Uploaden<input type="file" id="uploadInput" multiple accept="image/*,video/*" hidden></label>
      </div>
      <p id="uploadStatus" class="muted"></p>
      <div id="photoGrid" class="photo-grid"></div>
      <div id="photoSentinel"></div>
    </main>

    <!-- NODES -->
    <main id="tab-nodes" class="tab" hidden>
      <section class="nodes-head">
        <div id="clusterSummary" class="summary"></div>
        <div class="row-actions">
          <button class="primary" id="addData">+ Data-node</button>
          <button class="ghost" id="addWitness">+ Witness</button>
          <button class="ghost" id="runDrill">🧯 Brandoefening</button>
          <button class="ghost" id="runSnapshot">📸 Snapshot</button>
          <button class="ghost danger" id="sleepCluster">😴 Slapen</button>
        </div>
      </section>
      <div id="nodeCards" class="node-cards"></div>
      <div class="nodes-cols">
        <section>
          <h3>Opslag</h3>
          <div id="storeList" class="store-list"></div>
          <h3>Beleid</h3>
          <form id="policyForm" class="policy">
            <label class="check"><input type="checkbox" name="autoHeal"> Zelfherstel (vervangen en aanvullen)</label>
            <div class="row">
              <label>Data-nodes<input type="number" name="minDataNodes" min="1" max="5"></label>
              <label>Witnesses<input type="number" name="witnesses" min="0" max="3"></label>
              <label>Vervangen na (min)<input type="number" name="autoReplaceAfterMin" min="1" step="1"></label>
            </div>
            <button class="ghost">Opslaan</button>
          </form>
          <h3>Jobs</h3>
          <ul id="jobList" class="log"></ul>
        </section>
        <section>
          <h3>Gebeurtenissen</h3>
          <ul id="eventList" class="log"></ul>
        </section>
      </div>
    </main>
  </div>

  <dialog id="placeDlg" class="dlg">
    <form id="placeForm" method="dialog">
      <h3 id="placeTitle">Waar?</h3>
      <select name="placement" id="placeSelect"></select>
      <p class="muted" id="placeHint"></p>
      <div class="row"><span class="grow"></span><button value="cancel" formnovalidate class="ghost">Annuleren</button><button value="ok" class="primary">Starten</button></div>
    </form>
  </dialog>

  <!-- Dialogen -->
  <dialog id="composeDlg" class="dlg">
    <form id="composeForm" method="dialog">
      <h3>Nieuw bericht</h3>
      <input name="to" placeholder="Aan (komma's tussen adressen)" required>
      <input name="cc" placeholder="Cc">
      <input name="subject" placeholder="Onderwerp">
      <textarea name="text" rows="12" placeholder="Bericht"></textarea>
      <input type="file" name="files" multiple>
      <input type="hidden" name="replyToId">
      <p class="error" id="composeError"></p>
      <div class="row"><button value="cancel" formnovalidate class="ghost">Annuleren</button><button id="sendBtn" class="primary" value="send">Versturen</button></div>
    </form>
  </dialog>

  <dialog id="eventDlg" class="dlg">
    <form id="eventForm" method="dialog">
      <h3 id="eventDlgTitle">Afspraak</h3>
      <input name="title" placeholder="Titel" required>
      <label class="check"><input type="checkbox" name="all_day"> Hele dag</label>
      <div class="row"><label>Start<input type="datetime-local" name="start" required></label><label>Eind<input type="datetime-local" name="end" required></label></div>
      <input name="location" placeholder="Locatie">
      <textarea name="description" rows="3" placeholder="Beschrijving"></textarea>
      <div class="row">
        <label>Herhalen<select name="rrule">
          <option value="">Niet</option><option value="FREQ=DAILY">Dagelijks</option><option value="FREQ=WEEKLY">Wekelijks</option>
          <option value="FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR">Werkdagen</option><option value="FREQ=MONTHLY">Maandelijks</option><option value="FREQ=YEARLY">Jaarlijks</option>
        </select></label>
        <label>Agenda<select name="calendar_id" id="calSelect"></select></label>
      </div>
      <label>Herinnering<select name="reminder_min"><option value="">Geen</option><option value="10">10 min vooraf</option><option value="30">30 min vooraf</option><option value="60">1 uur vooraf</option><option value="1440">1 dag vooraf</option></select></label>
      <input type="hidden" name="id"><input type="hidden" name="occurrence">
      <div class="row">
        <button value="delete" id="deleteEvent" class="ghost danger" formnovalidate hidden>Verwijderen</button>
        <span class="grow"></span>
        <button value="cancel" formnovalidate class="ghost">Annuleren</button><button value="save" class="primary">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="photoDlg" class="viewer">
    <div class="viewer-bar">
      <button id="pvPrev" class="ghost">‹</button><span id="pvInfo" class="grow"></span>
      <button id="pvFav" class="ghost">☆</button><a id="pvDownload" class="ghost btn">⬇</a><button id="pvDelete" class="ghost danger">🗑</button>
      <button id="pvNext" class="ghost">›</button><button id="pvClose" class="ghost">✕</button>
    </div>
    <div id="pvMedia" class="viewer-media"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
