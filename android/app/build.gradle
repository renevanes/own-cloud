plugins {
    id "com.android.application"
}

// Versie komt uit het bestand VERSION in de repository: één nummer voor app en servers, bij elke wijziging omhoog
// (scripts/bump.sh). Het wijzigingslog (changelog.json) gaat mee in de app voor "Wat is er nieuw".
def versionProps = new Properties()
file("../../VERSION").withInputStream { versionProps.load(it) }
def signingReady = ["ANDROID_KEYSTORE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"].every { System.getenv(it) }
def verifyReleaseSigner = {
    if (!signingReady) throw new GradleException("Release signing requires all four ANDROID_KEYSTORE credentials from protected CI secrets. The public legacy key must not be used.")
    def releaseStore = java.security.KeyStore.getInstance(file(System.getenv("ANDROID_KEYSTORE")), System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray())
    def certificate = releaseStore.getCertificate(System.getenv("ANDROID_KEY_ALIAS"))
    def fingerprint = certificate == null ? "" : java.security.MessageDigest.getInstance("SHA-256").digest(certificate.encoded).encodeHex().toString().toUpperCase()
    def expected = file("../signing/certificate-sha256.txt").text.trim().replace(":", "").toUpperCase()
    if (fingerprint != expected) throw new GradleException("The CI key does not match android/signing/certificate-sha256.txt. Review the signer migration before publishing.")
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) verifyReleaseSigner()
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task -> task.name.toLowerCase().contains("release") && task.name.matches("(?i)(assemble|bundle|package|validateSigning).*Release.*") }) verifyReleaseSigner()
}


android {
    namespace "nl.eigencloud.app"
    compileSdk 34

    defaultConfig {
        applicationId "nl.eigencloud.app"
        minSdk 26
        targetSdk 34
        versionCode versionProps.getProperty("VERSION_CODE").toInteger()
        versionName versionProps.getProperty("VERSION_NAME")
        buildConfigField "String", "UPDATE_REPO", "\"${System.getenv("EIGEN_UPDATE_REPO") ?: "renevanes/own-cloud"}\""
        // Updates komen als OCI-pakket van ghcr.io (openbaar te lezen, ook als de repository privé is).
        buildConfigField "String", "UPDATE_IMAGE", "\"${System.getenv("EIGEN_UPDATE_IMAGE") ?: "renevanes/eigen-cloud-app"}\""
        // Adres van de Eigen Cloud Dienst (centrale betaalde dienst); leeg = optie verborgen.
        buildConfigField "String", "DIENST_URL", "\"${System.getenv("EIGEN_DIENST_URL") ?: file("../../DIENST_URL").readLines().collect { it.trim() }.find { it && !it.startsWith("#") } ?: ""}\""
    }

    buildFeatures { buildConfig true }

    // De Java-kern (setup, aanbieders, versleuteling) staat los, zodat hij ook zonder Android te testen is.
    sourceSets {
        main {
            java.srcDirs += "../core/src/main/java"
            assets.srcDirs += "$buildDir/generated/eigen-assets"
        }
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError true
        disable "SetJavaScriptEnabled", "AddJavascriptInterface", "QueryAllPackagesPermission", "GradleDependency", "OldTargetApi"
    }
}

// De schermen van de beheerconsole zijn dezelfde als op de computer: kopieer ze uit de repository.
def copyWeb = tasks.register("copyWebAssets", Sync) {
    into "$buildDir/generated/eigen-assets/www"
    from("../../web-console")
    from("../../web/shared") { into "shared" }
    from("../../web/fonts") { into "fonts" }
    from("../../changelog.json")
    // De lijst van aanbieders zoals bij deze versie (als de app de lijst op GitHub niet kan ophalen).
    from("../../aanbieders.json")
    from("src/main/www")
}
preBuild.dependsOn copyWeb
