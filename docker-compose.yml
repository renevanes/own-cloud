services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - CLUSTER_PORT=7946
      - RSPAMD_URL=${RSPAMD_URL:-}
    volumes:
      - ./data:/data
      - caddy_data:/caddy:ro          # certificaten van Caddy voor STARTTLS
    ports:
      - "25:2525"                     # inkomende mail
      - "7946:7946"                   # cluster (versleuteld, alleen nodig in clustermodus)
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  rspamd:
    image: rspamd/rspamd:3.14
    profiles: [spam]
    restart: unless-stopped
    expose: ["11333"]
    volumes:
      - rspamd_data:/var/lib/rspamd

volumes:
  caddy_data:
  rspamd_data:
