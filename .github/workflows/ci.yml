# Eén pijplijn voor alles. Bij elke push naar main:
#   0. versie: elke push is een nieuwe versie (VERSION + changelog.json, zie scripts/bump.sh en scripts/publish.sh);
#      bestaat versie X.Y al bij een andere commit, dan stopt alles hier
#   1. testen (Node en de Java-kern van de app)
#   2. de Android-app bouwen en ondertekenen (vaste sleutel, zie android/signing/README.md)
#   3. de app publiceren als pakket op ghcr.io (eigen-cloud-app) — daar haalt de app zelf zijn updates op
#   4. de server-images bouwen (met de app erin, zodat je hem van je eigen cloud kunt downloaden)
# Zet de pakketten eigen-cloud, eigen-caddy en eigen-cloud-app op ghcr.io één keer op "Public"
# (GitHub → je profiel → Packages → pakket → Package settings). De code en je data zitten er niet in.
name: CI
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
  packages: write
jobs:
  versie:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        name: Nieuwe versie?
        run: |
          source VERSION
          TOP=$(python3 -c "import json;print(json.load(open('changelog.json',encoding='utf-8'))[0]['version'])")
          if [ "$TOP" != "$VERSION_NAME" ]; then echo "::error::Het wijzigingslog begint bij $TOP, maar VERSION zegt $VERSION_NAME. Gebruik scripts/bump.sh."; exit 1; fi
          TAGGED=$(git ls-remote --tags origin "refs/tags/v$VERSION_NAME" | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::Versie $VERSION_NAME bestaat al (commit ${TAGGED:0:7}). Elke wijziging is een nieuwe versie: scripts/bump.sh \"wat er veranderd is\"."; exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Versie $VERSION_NAME (code $VERSION_CODE)"

  test:
    needs: versie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  core:
    needs: versie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: pipx install "moto[server]"
      - name: Java-kern (versleuteling, aanbieders, opslag, console) tegen de echte TypeScript-code
        run: android/core/test.sh

  apk:
    needs: [versie, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Sleutel uit secrets (als die er zijn)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/eigen.keystore"; echo "ANDROID_KEYSTORE=$RUNNER_TEMP/eigen.keystore" >> "$GITHUB_ENV"; fi
      - name: Bouwen (lint + release-APK)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EIGEN_UPDATE_REPO: ${{ github.repository }}
          EIGEN_UPDATE_IMAGE: ${{ github.repository_owner }}/eigen-cloud-app
          EIGEN_DIENST_URL: ${{ vars.EIGEN_DIENST_URL }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintRelease :app:assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong|FAILURE|ERROR" -A4 build.log | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: update.json (met wat er nieuw is)
        env: { V: "${{ needs.versie.outputs.name }}", CODE: "${{ needs.versie.outputs.code }}" }
        run: |
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/eigen-cloud.apk
          python3 - <<'PY'
          import hashlib, json, os, datetime
          apk = open("out/eigen-cloud.apk", "rb").read()
          log = json.load(open("changelog.json", encoding="utf-8"))
          info = {"version": os.environ["V"], "versionCode": int(os.environ["CODE"]), "sha256": hashlib.sha256(apk).hexdigest(),
                  "size": len(apk), "commit": os.environ["GITHUB_SHA"], "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "changelog": log[:10]}
          json.dump(info, open("out/update.json", "w", encoding="utf-8"), ensure_ascii=False)
          notes = "\n".join("- " + c for c in log[0]["changes"])
          open("out/notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          cat out/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            out/eigen-cloud.apk
            out/update.json
            out/notes.md
            android/app/build/reports/lint-results-release.html

  publish-app:
    needs: [versie, apk, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: app, path: art }
      - uses: oras-project/setup-oras@v1
      - name: App-update publiceren op ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd art/out
          IMG="ghcr.io/${{ github.repository_owner }}/eigen-cloud-app"
          oras push "$IMG:latest" --artifact-type application/vnd.eigencloud.app.v1 \
            update.json:application/json eigen-cloud.apk:application/vnd.android.package-archive
          oras tag "$IMG:latest" "v${{ needs.versie.outputs.name }}"
      - name: Kunnen telefoons en servers de updates ophalen? (anoniem, zoals zij dat doen)
        run: |
          for P in eigen-cloud-app eigen-cloud eigen-caddy; do
            IMG="${{ github.repository_owner }}/$P"
            T=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:$IMG:pull" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/$IMG/manifests/latest")
            if [ "$CODE" = 200 ]; then echo "$P: openbaar, updates werken"
            else echo "::warning title=Pakket $P is niet openbaar::Telefoons en servers kunnen $P niet ophalen (HTTP $CODE). Zet het één keer op Public: github.com/users/${{ github.repository_owner }}/packages/container/package/$P/settings → Change visibility → Public."; fi
          done
      - name: GitHub Release (elke versie een eigen release, met de APK)
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.versie.outputs.name }}" }
        run: |
          cp art/out/eigen-cloud.apk "Eigen-Cloud-v$V.apk"
          cp art/out/eigen-cloud.apk "Eigen-Cloud.apk"
          if gh release view "v$V" >/dev/null 2>&1; then
            # Opnieuw gedraaid voor dezelfde commit: bestanden vervangen
            gh release upload "v$V" "Eigen-Cloud-v$V.apk" "Eigen-Cloud.apk" --clobber
          else
            gh release create "v$V" "Eigen-Cloud-v$V.apk" "Eigen-Cloud.apk" --target "$GITHUB_SHA" --title "Eigen Cloud $V" --notes-file art/out/notes.md --latest
          fi

  images:
    needs: [versie, test, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: app, path: art }
      - run: cp art/out/eigen-cloud.apk art/out/update.json app-dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: EIGEN_VERSION=${{ needs.versie.outputs.name }}
          labels: org.opencontainers.image.version=${{ needs.versie.outputs.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eigen-cloud:latest
            ghcr.io/${{ github.repository_owner }}/eigen-cloud:v${{ needs.versie.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/eigen-cloud:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          labels: org.opencontainers.image.version=${{ needs.versie.outputs.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eigen-caddy:latest
            ghcr.io/${{ github.repository_owner }}/eigen-caddy:v${{ needs.versie.outputs.name }}
