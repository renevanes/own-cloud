# Eén pijplijn voor alles. Bij elke push naar main:
#   0. versie: elke push is een nieuwe versie (VERSION + changelog.json, zie scripts/bump.sh en scripts/publish.sh);
#      bestaat versie X.Y al bij een andere commit, dan stopt alles hier
#   1. testen (Node en de Java-kern van de app)
#   2. de Android-app bouwen en ondertekenen (vaste sleutel, zie android/signing/README.md)
#   3. de app publiceren als pakket op ghcr.io (eigen-cloud-app) — daar haalt de app zelf zijn updates op
#   4. de server-images bouwen (met de app erin, zodat je hem van je eigen cloud kunt downloaden)
# Zet de pakketten eigen-cloud, eigen-caddy en eigen-cloud-app op ghcr.io één keer op "Public"
# (GitHub → je profiel → Packages → pakket → Package settings). De code en je data zitten er niet in.
# Uitzondering: een push die alleen aanbieders.json wijzigt (een aanbieder op de lijst, samengevoegd vanuit de app) is geen
# nieuwe versie: dan draait de pijplijn niet (paths-ignore). De app leest de lijst rechtstreeks van GitHub. Zit er ook
# maar één ander bestand in de push (een gewone versie), dan draait alles zoals altijd.
name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - aanbieders.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  versie:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        name: Nieuwe versie?
        run: |
          source VERSION
          TOP=$(python3 -c "import json;print(json.load(open('changelog.json',encoding='utf-8'))[0]['version'])")
          if [ "$TOP" != "$VERSION_NAME" ]; then echo "::error::Het wijzigingslog begint bij $TOP, maar VERSION zegt $VERSION_NAME. Gebruik scripts/bump.sh."; exit 1; fi
          TAGGED=$(git ls-remote --tags origin "refs/tags/v$VERSION_NAME" | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::Versie $VERSION_NAME bestaat al (commit ${TAGGED:0:7}). Elke wijziging is een nieuwe versie: scripts/bump.sh \"wat er veranderd is\"."; exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Versie $VERSION_NAME (code $VERSION_CODE)"

  test:
    needs: versie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run test:browser

  core:
    needs: versie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: pipx install "moto[server]"
      - name: Java-kern (versleuteling, aanbieders, opslag, console) tegen de echte TypeScript-code
        run: android/core/test.sh

  apk:
    needs: [versie, core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.9" }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Vereiste nieuwe ondertekensleutel uit secrets
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::Configureer een nieuwe, niet-blootgestelde Android-ondertekensleutel in de CI-secrets (android/signing/README.md)."; exit 1; fi
          umask 077
          echo "$KS" | base64 -d > "$RUNNER_TEMP/eigen.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/eigen.keystore" >> "$GITHUB_ENV"
      - name: Bouwen (lint + release-APK)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EIGEN_UPDATE_REPO: ${{ github.repository }}
          EIGEN_UPDATE_IMAGE: ${{ github.repository_owner }}/eigen-cloud-app
          EIGEN_DIENST_URL: ${{ vars.EIGEN_DIENST_URL }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintRelease :app:assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong|FAILURE|ERROR" -A4 build.log | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: update.json (met wat er nieuw is)
        env: { V: "${{ needs.versie.outputs.name }}", CODE: "${{ needs.versie.outputs.code }}" }
        run: |
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/eigen-cloud.apk
          python3 - <<'PY'
          import hashlib, json, os, datetime
          apk = open("out/eigen-cloud.apk", "rb").read()
          log = json.load(open("changelog.json", encoding="utf-8"))
          info = {"version": os.environ["V"], "versionCode": int(os.environ["CODE"]), "sha256": hashlib.sha256(apk).hexdigest(),
                  "size": len(apk), "apk": "Eigen-Cloud-v" + os.environ["V"] + ".apk", "commit": os.environ["GITHUB_SHA"], "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "changelog": log[:10]}
          json.dump(info, open("out/update.json", "w", encoding="utf-8"), ensure_ascii=False)
          notes = "\n".join("- " + c for c in log[0]["changes"])
          open("out/notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          cat out/update.json
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            out/eigen-cloud.apk
            out/update.json
            out/notes.md
            android/app/build/reports/lint-results-release.html

  publish-app:
    permissions:
      contents: read
      packages: write
    needs: [versie, apk, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: app, path: art }
      - uses: oras-project/setup-oras@v2
      - name: Vaste app-uitgave publiceren
        env: { V: "${{ needs.versie.outputs.name }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${{ github.repository_owner }}/eigen-cloud-app"
          if oras manifest fetch "$IMG:v$V" > prior-app.json 2>/dev/null; then
            python3 scripts/verify-release-manifest.py prior-app.json "$GITHUB_SHA" "$V" art/out/eigen-cloud.apk
          else
            cd art/out
            oras push "$IMG:v$V" --artifact-type application/vnd.eigencloud.app.v1 \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" --annotation "org.opencontainers.image.version=$V" \
              update.json:application/json eigen-cloud.apk:application/vnd.android.package-archive
          fi

  images:
    permissions:
      contents: read
      packages: write
    needs: [versie, test, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: app, path: art }
      - run: cp art/out/eigen-cloud.apk art/out/update.json app-dist/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2
      - id: fixed
        name: Bestaande vaste images bewaren
        env: { V: "${{ needs.versie.outputs.name }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          for PAIR in cloud:eigen-cloud caddy:eigen-caddy; do
            NAME=${PAIR%:*}; IMAGE=${PAIR#*:}
            if oras manifest fetch "ghcr.io/${{ github.repository_owner }}/$IMAGE:v$V" > "$NAME.json" 2>/dev/null; then
              python3 scripts/verify-release-manifest.py "$NAME.json" "$GITHUB_SHA" "$V"
              echo "$NAME=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: docker/build-push-action@v7
        if: steps.fixed.outputs.cloud != 'true'
        with:
          context: .
          push: true
          build-args: EIGEN_VERSION=${{ needs.versie.outputs.name }}
          labels: |
            org.opencontainers.image.version=${{ needs.versie.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.version=${{ needs.versie.outputs.name }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eigen-cloud:v${{ needs.versie.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/eigen-cloud:${{ github.sha }}
      - uses: docker/build-push-action@v7
        if: steps.fixed.outputs.caddy != 'true'
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          labels: |
            org.opencontainers.image.version=${{ needs.versie.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.version=${{ needs.versie.outputs.name }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eigen-caddy:v${{ needs.versie.outputs.name }}

  promote:
    permissions:
      contents: write
      packages: write
    needs: [versie, publish-app, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: app, path: art }
      - uses: oras-project/setup-oras@v2
      - name: De hele uitgave controleren en publiceren
        env: { V: "${{ needs.versie.outputs.name }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          for P in eigen-cloud eigen-caddy eigen-cloud-app; do
            IMG="${{ github.repository_owner }}/$P"
            oras manifest fetch "ghcr.io/$IMG:v$V" > "$P.json"
            python3 scripts/verify-release-manifest.py "$P.json" "$GITHUB_SHA" "$V"
            T=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$IMG:pull" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
            curl -fsS -o /dev/null -H "Authorization: Bearer $T" -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/$IMG/manifests/v$V"
          done
          LATEST=false
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            for P in eigen-caddy eigen-cloud eigen-cloud-app; do oras tag "ghcr.io/${{ github.repository_owner }}/$P:v$V" latest; done
            LATEST=true
          fi
          cp art/out/eigen-cloud.apk "Eigen-Cloud-v$V.apk"
          cp art/out/eigen-cloud.apk Eigen-Cloud.apk
          cp art/out/update.json update.json
          if gh release view "v$V" >/dev/null 2>&1; then
            mkdir prior-release
            gh release download "v$V" --pattern update.json --dir prior-release
            python3 - <<'CHECK'
          import json
          before = json.load(open("prior-release/update.json"))
          current = json.load(open("update.json"))
          assert all(before.get(k) == current.get(k) for k in ("version", "versionCode", "commit", "sha256", "size")), "Deze versie is al gepubliceerd met andere bestanden. Verhoog het versienummer."
          CHECK
          else
            gh release create "v$V" "Eigen-Cloud-v$V.apk" Eigen-Cloud.apk update.json --target "$GITHUB_SHA" --title "Eigen Cloud $V" --notes-file art/out/notes.md --latest="$LATEST"
          fi
